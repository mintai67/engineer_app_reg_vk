<head>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script>
        // Инициализация VK Bridge при загрузке
        try {
            vkBridge.send('VKWebAppInit')
                .then(() => console.log("VK Bridge успешно запущен!"))
                .catch(e => console.error("Ошибка при старте VK Bridge:", e));
        } catch (err) {
            console.error("vkBridge не доступен:", err);
        }

        async function registration() {
            const results = {
                'Фамилия': document.getElementById("main_field_1")?.value || '',
                'Имя': document.getElementById("main_field_2")?.value || '',
                'Отчество': document.getElementById("main_field_3")?.value || ''
            };

            const urlParams = new URLSearchParams(window.location.search);
            const vkUserId = urlParams.get('vk_user_id');
            const groupId = urlParams.get('vk_group_id');

            try {
                // Если есть ID группы, просим разрешение на отправку сообщений
                if (groupId) {
                    await vkBridge.send('VKWebAppAllowMessagesFromGroup', {
                        group_id: parseInt(groupId, 10)
                    });
                }

                // Отправка данных на ваш сервер
                await fetch('https://vash-sait.ru/api/vk-register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: vkUserId, data: results })
                });

            } catch (vkErr) {
                console.error("Ошибка при регистрации или пользователь отменил действие:", vkErr);
            } finally {
                // Закрываем мини-приложение после попытки отправки
                vkBridge.send('VKWebAppClose', { status: 'success' });
            }
        }
    </script>
</head>
<div>
    <h2>Регистрация</h2>
     <div style="font-family: Verdana, sans-serif; color: #333;">
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_1" placeholder="Фамилия"></input>
        </form>
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_2" placeholder="Имя"></input>
        </form>
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_3" placeholder="Отчество"></input>
        </form>
    </div>
     <button style="
    background-color: #4b3697;
    color: white; 
    padding: 15px 30px; 
    font-size: 18px; 
    border: none;
    border-radius: 10px;    
    cursor: pointer;
     width: 100%;
    text-align: center;"
    id="main-btn" onclick="registration()">Зарегистрироваться</button>
</div>
