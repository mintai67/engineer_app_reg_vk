<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <!-- Подключаем официальный VK Bridge CDN -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
    <h2>Форма регистрации</h2>

    <input type="text" id="main_field_1" placeholder="Фамилия"><br><br>
    <input type="text" id="main_field_2" placeholder="Имя"><br><br>
    <input type="text" id="main_field_3" placeholder="Отчество"><br><br>
    
    <button onclick="registration()">Отправить</button>

    <script>
        // 1. Инициализируем VK Bridge строго при загрузке окна
        window.onload = () => {
            if (window.vkBridge) {
                vkBridge.send('VKWebAppInit')
                    .then(() => console.log('VK Bridge успешно запущен!'))
                    .catch(err => console.error('Ошибка инициализации:', err));
            }
        };

        // 2. Функция отправки данных
        async function registration() {
    // 1. Собираем ФИО из полей
    const surname = document.getElementById("main_field_1")?.value.trim() || '';
    const name = document.getElementById("main_field_2")?.value.trim() || '';
    const patronymic = document.getElementById("main_field_3")?.value.trim() || '';

    if (!surname || !name) {
        alert("Пожалуйста, заполните имя и фамилию!");
        return;
    }

    // 2. Получаем ID группы из URL
    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('vk_group_id'); // Наример: 200000000

    // 3. Формируем компактную строку данных (например: Ivanov_Ivan_Ivanovich)
    // Заменяем пробелы на подчеркивания, чтобы не было спецсимволов
    const rawData = `${surname}_${name}_${patronymic}`.replace(/\s+/g, '_');
    
    // Преобразуем в Base64 для безопасной передачи через URL (опционально)
    const refData = btoa(unescape(encodeURIComponent(rawData))); 

    try {
        if (window.vkBridge) {
            // Запрашиваем разрешение на сообщения (если еще не дано)
            if (groupId) {
                await vkBridge.send('VKWebAppAllowMessagesFromGroup', {
                    group_id: parseInt(groupId, 10)
                });
            }

            // Перенаправляем пользователя в диалог с ботом с параметром ref
            // Ссылка имеет вид: https://vk.me/publicGROUP_ID?ref=ПОЛЕ_С_ДАННЫМИ
            const vkMeUrl = `https://vk.me/club${groupId}?ref=${refData}`;
            
            // Открываем ссылку через VK Bridge или напрямую
            await vkBridge.send('VKWebAppOpenURL', { url: vkMeUrl });

            // Закрываем мини-приложение
            vkBridge.send('VKWebAppClose', { status: 'success' });
        }
    } catch (error) {
        console.error("Ошибка при отправке:", error);
        alert("Не удалось перейти в диалог с ботом.");
    }
}
    </script>
</body>
</html>
<div>
    <h2>Регистрация</h2>
     <div style="font-family: Verdana, sans-serif; color: #333;">
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_1" placeholder="Фамилия"></input>
        </form>
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_2" placeholder="Имя"></input>
        </form>
        <form>
            <input type="text" class="field" style="width: 100%; height: 40px; font-weight: bold; border-radius: 10px; font-size: 16px;" id="main_field_3" placeholder="Отчество"></input>
        </form>
    </div>
     <button style="
    background-color: #4b3697;
    color: white; 
    padding: 15px 30px; 
    font-size: 18px; 
    border: none;
    border-radius: 10px;    
    cursor: pointer;
     width: 100%;
    text-align: center;"
    id="main-btn" onclick="registration()">Зарегистрироваться</button>
</div>
